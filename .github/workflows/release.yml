name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate release
        run: npm run validate

      - name: Create version pull request or tag release
        uses: changesets/action@v1
        with:
          version: npm run version
          publish: npm run release
          commit: "chore: version figloom"
          title: "chore: version figloom"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish GitHub release for current tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v${version}"
          git fetch --tags --force

          if ! git rev-parse --verify "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "No ${tag} tag yet; version pull request may still be pending."
            exit 0
          fi

          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "GitHub Release ${tag} already exists."
            exit 0
          fi

          gh release create "${tag}" \
            --verify-tag \
            --title "Figloom ${version}" \
            --generate-notes
